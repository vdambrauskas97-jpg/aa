        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fbfcfe;
        font-family: "Geist", sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #price {
        z-index: 1;
      }
      #flow {

      }
      #route {

      }
      #outro {

      <div

        class="scene"
        data-composition-id="price"
        data-composition-src="compositions/price.html"
        data-start="0"
        data-duration="9.81"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="flow"
        class="scene"
        data-composition-id="flow"
        data-composition-src="compositions/flow.html"
        data-start="9.81"
        data-duration="6.01"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"

        data-height="1920"

        data-duration="3.46"
        data-track-index="2"

      <!-- Music: "Newer Wave" by Kevin MacLeod, incompetech.com (CC BY 4.0), 110 BPM: the film's own grid.
           Starts 47.5 s in: the breakdown sits under the hook and the fee rows, and the downbeat of the
           full return (track 54.577 s) lands on the total at 7.07 s. A low-pass opens from 1.5 kHz to full
           range over the reveal, so the bed is held back under the hook and clears on the total. -->
      <audio
        id="bg-music"
        class="clip"
        data-timeline-role="music"
        data-start="0"
        data-duration="22"
        data-media-start="47.5"
        data-volume="0.32"
        data-fade-in="0.3"
        data-fade-out="1.5"
        data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;lowpass&quot;,&quot;id&quot;:&quot;lp&quot;,&quot;label&quot;:&quot;Build filter&quot;,&quot;params&quot;:{&quot;frequency&quot;:1500,&quot;q&quot;:0.707,&quot;poles&quot;:&quot;2&quot;}}]}"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;fx.lp.frequency&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:1500},{&quot;t&quot;:2.5,&quot;v&quot;:1500},{&quot;t&quot;:4.0,&quot;v&quot;:2100},{&quot;t&quot;:5.6,&quot;v&quot;:3000},{&quot;t&quot;:6.4,&quot;v&quot;:4500},{&quot;t&quot;:6.95,&quot;v&quot;:7500},{&quot;t&quot;:7.04,&quot;v&quot;:9000},{&quot;t&quot;:7.07,&quot;v&quot;:20000}]}]}"
        data-track-index="10"
        src="assets/music/newer-wave-by-kevin-macleod.mp3"
      ></audio>
