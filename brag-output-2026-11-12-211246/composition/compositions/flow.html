    (function () {
      const tl = gsap.timeline({ paused: true });
      // Local time 0 = 9.81 s in the film.

      /* ---------- Find: one search (0 – 2.7 s) ---------- */
      tl.fromTo("#f-sbar", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 0);
      tl.fromTo(
        "#f-sbar",
        { y: 90, filter: "blur(12px)" },
        { y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" },
        0,

      tl.fromTo("#f-chip", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 0.03);

        ".f-c1w",
        { opacity: 0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.07, ease: "power2.out" },
        0.1,
      );
      // typing "bmw m5", one key every 0.07 s
      const keys = [0.22, 0.29, 0.36, 0.44, 0.51, 0.58];
      gsap.utils.toArray(".f-k").forEach(function (el, i) {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, keys[i]);
      });
      // beat-grid: result rows at 10.47, 10.69, 10.91s; the highlight lands on a sixteenth of the bass gallop at 11.30s
      [
        ["#f-row1", 0.66],
        ["#f-row2", 0.88],
        ["#f-row3", 1.1],
      ].forEach(function (r) {
        tl.fromTo(
          r[0],
          { opacity: 0, y: 34 },
          { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" },
          r[1],
        );
      });
      // the site's highlight ring on the middle row; its delivered price takes the accent
      tl.fromTo(
        "#f-ring",
        { opacity: 0, scale: 1.03 },
        { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" },
        1.49,
      );
      tl.to("#f-deliv-v", { color: "#0e74c5", duration: 0.12, ease: "none" }, 1.49);
      tl.fromTo(
        "#f-deliv",
        { scale: 1 },
        { scale: 1.07, duration: 0.14, ease: "power2.out", immediateRender: false },
        1.49,
      );
      tl.to("#f-deliv", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 1.63);

      // search leaves; the picked row becomes the bid card for the same car
      tl.to(
        ["#f-sbar", "#f-row1", "#f-row3"],
        { opacity: 0, y: -18, filter: "blur(8px)", duration: 0.2, stagger: 0.02, ease: "power2.in" },
        2.72,
      );
      tl.to(["#f-chip", "#f-cap1"], { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 2.7);
      tl.to(["#f-row2", "#f-ring"], { opacity: 0, duration: 0.14, ease: "power1.in" }, 2.84);

      /* ---------- Bid: never above your maximum (2.78 – 6.01 s) ---------- */
      tl.fromTo("#f-bid", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 2.78);
      tl.fromTo(
        "#f-bid",
        { y: 354, scaleY: 0.272 },
        { y: 0, scaleY: 1, duration: 0.38, ease: "power3.out" },
        2.78,

      tl.fromTo("#f-bid-in", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, 2.88);
      tl.fromTo(
        ".f-c2w",
        { opacity: 0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.06, ease: "power2.out" },
        3.08,

      // the bid ticks up (13.50 s and 13.95 s in the film)
      tl.fromTo("#f-pv2", { opacity: 0, y: 80 }, { opacity: 0, y: 80, duration: 0.01 }, 0);
      tl.fromTo("#f-pv3", { opacity: 0, y: 80 }, { opacity: 0, y: 80, duration: 0.01 }, 0);
      tl.to("#f-pv1", { opacity: 0, y: -80, duration: 0.16, ease: "power2.in" }, 3.67);
      tl.to("#f-pv2", { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 3.7);
      tl.to("#f-pv2", { opacity: 0, y: -80, duration: 0.16, ease: "power2.in" }, 4.12);
      tl.to("#f-pv3", { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 4.15);
      // beat-locked: 14.17s (win banner on the snare)

        { opacity: 0, y: 34, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.26, ease: "expo.out" },

      tl.to("#f-stage", { y: -160, opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, 5.83);
