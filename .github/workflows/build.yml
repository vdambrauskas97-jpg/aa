name: Build site

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload site bundle
        uses: actions/upload-artifact@v4
        with:
          name: bidport-dist
          path: dist/
          if-no-files-found: error
